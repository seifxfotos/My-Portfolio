<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Seif Ahmed | Portfolio</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Outfit:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #020408; 
            --surface-color: #0b111a;
            --surface-glass: rgba(11, 17, 26, 0.85);
            --border-color: rgba(37, 109, 150, 0.3); 
            
            --text-main: #f4f4f6;
            --text-muted: #9ba1a6;
            
            --accent-blue: #256d96; 
            --accent-blue-glow: rgba(37, 109, 150, 0.15);
            --accent-gold: #d4af37; 
            --accent-gold-glow: rgba(212, 175, 55, 0.15);
            
            --font-ar: 'Cairo', sans-serif;
            --font-en: 'Outfit', sans-serif;
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none !important;
        }

        html, body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-ar);
            overflow-x: hidden; 
            overflow-y: hidden;
            width: 100%;
            height: 100dvh;
            perspective: 1200px; 
            position: relative;
        }

        html[lang="en"] body {
            font-family: var(--font-en);
        }

        /* Custom Cursor */
        .cursor-dot, .cursor-circle {
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 99999;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s, background-color 0.3s, opacity 0.2s;
        }
        .cursor-dot { width: 8px; height: 8px; background-color: var(--accent-gold); }
        .cursor-circle { width: 36px; height: 36px; border: 1px solid rgba(212, 175, 55, 0.6); background-color: rgba(212, 175, 55, 0.05); }

        /* ✨ HIGH-END SMOOTH LIGHTING */
        .mesh-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100dvh; z-index: 0; overflow: hidden; background-color: var(--bg-color); pointer-events: none; }
        .mesh-blob { position: absolute; border-radius: 50%; transition: transform 1.2s cubic-bezier(0.7, 0, 0.3, 1), background 1.2s ease; will-change: transform; pointer-events: none; }
        
        .blob-1 { width: 700px; height: 700px; background: radial-gradient(circle, rgba(37, 109, 150, 0.65) 0%, rgba(37, 109, 150, 0) 70%); top: -15%; left: -15%; animation: float1 4s infinite alternate ease-in-out; }
        .blob-2 { width: 550px; height: 550px; background: radial-gradient(circle, rgba(37, 109, 150, 0.45) 0%, rgba(37, 109, 150, 0) 70%); bottom: 5%; left: 5%; animation: float2 3.5s infinite alternate-reverse ease-in-out; }
        .blob-3 { width: 750px; height: 750px; background: radial-gradient(circle, rgba(212, 175, 55, 0.45) 0%, rgba(212, 175, 55, 0) 70%); bottom: -15%; right: -15%; animation: float3 4.5s infinite alternate ease-in-out; }
        .blob-4 { width: 500px; height: 500px; background: radial-gradient(circle, rgba(212, 175, 55, 0.35) 0%, rgba(212, 175, 55, 0) 70%); top: 5%; right: 5%; animation: float4 3s infinite alternate-reverse ease-in-out; }

        @keyframes float1 { 0% { transform: translate(0, 0); } 100% { transform: translate(50px, 40px); } }
        @keyframes float2 { 0% { transform: translate(0, 0); } 100% { transform: translate(-40px, -50px); } }
        @keyframes float3 { 0% { transform: translate(0, 0); } 100% { transform: translate(-50px, -30px); } }
        @keyframes float4 { 0% { transform: translate(0, 0); } 100% { transform: translate(40px, 60px); } }

        .mesh-bg.slide-2-active .blob-1 { transform: translate(-10vw, -10vh) scale(0.8) !important; background: radial-gradient(circle, rgba(212, 175, 55, 0.45) 0%, rgba(212, 175, 55, 0) 70%); }
        .mesh-bg.slide-2-active .blob-2 { transform: translate(-5vw, 15vh) scale(1.2) !important; background: radial-gradient(circle, rgba(37, 109, 150, 0.65) 0%, rgba(37, 109, 150, 0) 70%); }
        .mesh-bg.slide-2-active .blob-3 { transform: translate(15vw, 10vh) scale(0.9) !important; background: radial-gradient(circle, rgba(37, 109, 150, 0.55) 0%, rgba(37, 109, 150, 0) 70%); }
        .mesh-bg.slide-2-active .blob-4 { transform: translate(10vw, -15vh) scale(1.3) !important; background: radial-gradient(circle, rgba(212, 175, 55, 0.5) 0%, rgba(212, 175, 55, 0) 70%); }

        /* Header & Animated SVG Logo */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, rgba(2,4,8,0.9) 0%, rgba(2,4,8,0) 100%);
            z-index: 1000;
        }
        
        .logo-svg { display: flex; align-items: center; transition: var(--transition); }
        .logo-svg svg { height: 45px; width: auto; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.3)); transition: var(--transition); }
        
        .animated-path {
            fill: transparent;
            stroke: #fff;
            stroke-width: 15px; 
            stroke-dasharray: 1;
            stroke-dashoffset: 1;
            animation: drawAndFill 3.5s cubic-bezier(0.7, 0, 0.3, 1) forwards;
        }
        @keyframes drawAndFill {
            0% { stroke-dashoffset: 1; fill: transparent; stroke: #fff; }
            60% { stroke-dashoffset: 0; fill: transparent; stroke: #fff; }
            100% { stroke-dashoffset: 0; fill: #fff; stroke: transparent; }
        }
        .logo-svg:hover svg .animated-path { fill: var(--accent-gold); transition: fill 0.3s ease; }
        
        .nav-links { display: flex; gap: 30px; list-style: none; align-items: center; }
        .nav-links a { text-decoration: none; color: var(--text-muted); font-weight: 500; font-size: 0.95rem; transition: var(--transition); }
        .nav-links a:hover { color: var(--text-main); }
        
        .nav-actions { display: flex; gap: 15px; align-items: center; }
        .lang-btn { background: transparent; border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 18px; border-radius: 30px; font-size: 0.85rem; font-weight: 600; transition: var(--transition); cursor: pointer !important; }
        .lang-btn:hover { border-color: var(--accent-blue); background: var(--accent-blue-glow); }

        /* Burger Menu (Hidden on Desktop) */
        .menu-toggle {
            display: none;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: var(--transition);
            cursor: pointer !important;
        }
        .menu-toggle:hover { border-color: var(--accent-blue); background: var(--accent-blue-glow); }

        /* Dropdown Menu for Mobile */
        .mobile-dropdown {
            position: absolute;
            top: 75px;
            left: 5%;
            right: 5%;
            background: var(--surface-glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            opacity: 0;
            pointer-events: none;
            transform: translateY(-10px);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 2000;
        }
        .mobile-dropdown.active {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }
        .mobile-dropdown a {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 600;
            font-size: 1.05rem;
            padding: 10px 15px;
            border-radius: 12px;
            background: rgba(255,255,255,0.02);
            transition: var(--transition);
        }
        .mobile-dropdown a:hover { background: var(--accent-blue-glow); color: var(--accent-gold); }

        /* Slide Engine Structure */
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100dvh;
            transition: transform 1.2s cubic-bezier(0.7, 0, 0.2, 1), opacity 1.2s cubic-bezier(0.7, 0, 0.2, 1), filter 1.2s ease;
            will-change: transform, opacity;
            transform-style: preserve-3d;
        }

        /* 🔥 HERO LAYOUT 🔥 */
        hero { z-index: 1; padding-top: 80px; transform-origin: center center; }
        
        hero.slide-out {
            transform: scale(0.8) translateY(-10%) rotateX(10deg);
            opacity: 0;
            filter: blur(15px);
            pointer-events: none;
        }

        .hero-layout { display: flex; justify-content: space-between; align-items: center; width: 100%; height: 100%; position: relative; z-index: 2; }
        
        .hero-right { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: flex-start; 
            padding: 0 8%; 
            z-index: 4; 
        }
        
        .availability-badge { display: inline-flex; align-items: center; gap: 8px; background: rgba(11, 17, 26, 0.5); backdrop-filter: blur(10px); border: 1px solid var(--border-color); padding: 6px 14px; border-radius: 50px; font-size: 0.85rem; margin-bottom: 30px; }
        .status-dot { width: 8px; height: 8px; background-color: var(--accent-blue); border-radius: 50%; box-shadow: 0 0 10px var(--accent-blue); }
        
        .hero-desc {
            font-size: clamp(1.2rem, 2vw, 1.8rem);
            font-weight: 700;
            color: #fff;
            max-width: 500px;
            margin-bottom: 40px;
            line-height: 1.6;
            text-shadow: 0 5px 15px rgba(0,0,0,0.8);
        }

        .btn-primary {
            background: var(--accent-blue);
            color: #fff;
            padding: 14px 28px;
            border-radius: 35px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 10px 30px rgba(37, 109, 150, 0.4);
        }
        .btn-primary:hover { background: var(--accent-gold); color: #000; transform: translateY(-5px) scale(1.05); box-shadow: 0 15px 35px rgba(212, 175, 55, 0.5); }
        .btn-primary:active { transform: scale(0.95); }

        .hero-center { flex: 1.2; display: flex; justify-content: center; align-items: flex-end; height: 100%; position: relative; }
        
        .bg-logo-huge {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: clamp(600px, 140%, 1200px); 
            z-index: 1; 
            pointer-events: none;
            /* أوبستي عالية للكمبيوتر */
            opacity: 0.55; 
        }

        .hero-portrait {
            max-height: 88dvh; 
            width: auto;
            z-index: 3; 
            position: relative;
            bottom: -5dvh; 
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 6%, black 55%, transparent 95%);
            mask-image: linear-gradient(to bottom, transparent 0%, black 6%, black 55%, transparent 95%);
            animation: floatPortrait 8s ease-in-out infinite;
        }

        @keyframes floatPortrait { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }

        .hero-left { 
            flex: 1; 
            display: flex; 
            justify-content: flex-end; 
            align-items: center; 
            padding: 0 8%; 
            z-index: 4; 
        }
        
        .btn-secondary {
            background: rgba(11, 17, 26, 0.6);
            backdrop-filter: blur(12px);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 14px 28px;
            border-radius: 35px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .btn-secondary:hover { border-color: var(--accent-blue); background: var(--accent-blue-glow); transform: translateY(-5px) scale(1.05); }
        .btn-secondary:active { transform: scale(0.95); }

        /* Slide 2 (Showcase) */
        #showcase {
            z-index: 5; 
            background-color: var(--surface-color); 
            transform: translateY(100dvh); 
            padding: 100px 10%;
            overflow-y: auto; 
            overflow-x: hidden;
            border-top: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 -40px 100px rgba(0,0,0, 0.9); 
            perspective: 1500px;
        }
        #showcase.slide-in { transform: translateY(0); }
        #showcase::-webkit-scrollbar { display: none; }
        
        .section-title { font-size: 2.5rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -1px; opacity: 0; transform: translateY(30px); transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        .section-title.reveal { opacity: 1; transform: translateY(0); }

        .bento-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; padding-bottom: 50px; width: 100%; }
        .bento-card {
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 35px;
            opacity: 0;
            transform: translateY(120px) scale(0.7) rotateX(25deg);
            transform-style: preserve-3d;
            transition: all 0.9s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .bento-card.reveal { opacity: 1; transform: translateY(0) scale(1) rotateX(0deg); }
        .bento-card.reveal:hover { border-color: rgba(37, 109, 150, 0.6); transform: translateY(-6px) scale(1.02); box-shadow: 0 20px 40px rgba(0,0,0,0.5); background: rgba(255, 255, 255, 0.06); }
        .bento-card.large { grid-column: span 2; }
        .bento-card h3 { font-size: 1.5rem; margin-bottom: 15px; font-weight: 700; }
        .bento-card p { color: var(--text-muted); line-height: 1.6; font-size: 0.95rem; }

        /* CV Modal */
        .cv-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100dvh;
            background: rgba(2, 4, 8, 0.95);
            backdrop-filter: blur(25px);
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            perspective: 1500px;
        }
        .cv-modal.active { opacity: 1; pointer-events: auto; }
        
        .cv-modal-content {
            background: var(--surface-color);
            border: 1px solid rgba(37, 109, 150, 0.4);
            width: 95%;
            max-width: 1200px;
            height: 92dvh;
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 35px 70px rgba(0,0,0,0.9);
            transform: scale(0.5) translateY(200px) rotateX(-20deg);
            opacity: 0;
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.5s ease;
        }
        .cv-modal.active .cv-modal-content { transform: scale(1) translateY(0) rotateX(0deg); opacity: 1; }
        
        .cv-modal-header { padding: 22px 35px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); background: var(--bg-color); z-index: 10; }
        .cv-modal-header h3 { font-size: 1.25rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .cv-modal-header h3 i { color: var(--accent-gold); }
        .cv-modal-actions { display: flex; gap: 15px; align-items: center; }
        
        .btn-download-cv { background: var(--accent-blue); color: #fff; padding: 10px 22px; border-radius: 30px; font-weight: 700; font-size: 0.88rem; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; transition: var(--transition); }
        .btn-download-cv:hover { background: var(--accent-gold); color: #000; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3); }
        
        .close-modal { cursor: pointer !important; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color); color: var(--text-main); width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; transition: var(--transition); }
        .close-modal:hover { background: rgba(255, 255, 255, 0.12); border-color: var(--accent-blue); color: var(--accent-blue); }

        /* CV Viewer Area */
        .cv-viewer-area { position: relative; flex-grow: 1; width: 100%; background: #05080f; overflow: hidden; display: flex; }
        .cv-scroll-area { width: 100%; height: 100%; overflow: auto; padding: 30px; display: flex; justify-content: center; align-items: flex-start; user-select: none; -webkit-user-drag: none; cursor: grab !important; will-change: scroll-position; }
        .cv-scroll-area:active { cursor: grabbing !important; }
        .cv-scroll-area::-webkit-scrollbar { width: 14px; height: 14px; }
        .cv-scroll-area::-webkit-scrollbar-track { background: #05080f; border-radius: 10px; }
        .cv-scroll-area::-webkit-scrollbar-thumb { background: var(--accent-blue); border-radius: 10px; border: 3px solid #05080f; background-clip: padding-box; }
        .cv-scroll-area::-webkit-scrollbar-thumb:hover { background: var(--accent-gold); }
        .cv-image-preview { max-width: 100%; max-height: 75vh; width: auto; height: auto; object-fit: contain; transform-origin: top center; pointer-events: none; user-select: none; -webkit-user-drag: none; transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); box-shadow: 0 15px 40px rgba(0,0,0,0.8); border-radius: 4px; will-change: transform; }

        .zoom-controls { position: absolute; bottom: 30px; right: 40px; background: var(--surface-glass); backdrop-filter: blur(12px); border: 1px solid var(--border-color); border-radius: 12px; display: flex; flex-direction: column; gap: 5px; padding: 6px; z-index: 50; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .zoom-controls button { background: transparent; border: none; color: var(--text-main); width: 45px; height: 45px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; transition: var(--transition); cursor: pointer !important; }
        .zoom-controls button:hover { background: var(--accent-blue-glow); color: var(--accent-blue); }

        /* 🔥 MOBILE UI - التعديلات المطلوبة بدقة 🔥 */
        @media(max-width: 900px) {
            @media (pointer: coarse) { .cursor-dot, .cursor-circle { display: none !important; } * { cursor: auto !important; } }
            header { padding: 15px 5%; }
            
            .nav-links { display: none; } 
            .menu-toggle { display: flex; }
            
            .hero-layout { 
                flex-direction: column; 
                justify-content: space-between; 
                /* تقليل البادينج من فوق لدفع العناصر لأعلى */
                padding-top: 40px; 
                /* زيادة البادينج من تحت لدفع زر الـ CV لأعلى */
                padding-bottom: 60px;
            }
            
            .hero-right { 
                flex: none; 
                order: 1; 
                padding: 0 5%; 
                width: 100%; 
                align-items: center; 
                text-align: center; 
                margin-top: 0;
            }
            .availability-badge { margin-bottom: 8px; }
            .hero-desc { font-size: 0.95rem; margin-bottom: 12px; line-height: 1.4; }
            
            .hero-center { 
                flex: 1; 
                order: 2; 
                height: auto; 
                width: 100%; 
                align-items: center; 
            }
            /* تصغير الصورة قليلاً لإعطاء مساحة للعناصر العلوية والسفلية */
            .hero-portrait { max-height: 42dvh; bottom: 0; }
            
            /* التعديل الأول: تصغير اللوجو الخلفي وتعيين الأوبستي لـ 100% */
            .bg-logo-huge { width
